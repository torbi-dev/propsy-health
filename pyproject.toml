[project]
name = "propsy-health"
version = "1.0.0"
description = "Google Health OAuth Connector for Propsy Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.52.0",
    "motor>=3.6.0",
    "pymongo>=4.17.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",
    "httpx>=0.27.2",
    "cryptography>=43.0.3",
    "bcrypt>=4.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uvicorn]
host = "127.0.0.1"
port = 8080
reload = false
log-level = "info"