<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin - Propsy Health{% endblock %}</title>
    
    <!-- CRITICAL: Load the main CSS file with absolute path -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/main.css') }}">
    
    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Load Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="navbar-brand">
                <span style="font-size: 1.5rem;">🏥</span> Propsy Health
            </a>
            
            <ul class="navbar-menu">
                <li><a href="/" class="navbar-link">Home</a></li>
                <li><a href="/privacy" class="navbar-link">Privacy</a></li>
                <li><a href="/admin/" class="navbar-link">Admin</a></li>
            </ul>
        </div>
    </nav>
    
    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Propsy Health Admin Panel</p>
        </div>
    </footer>

</body>
</html>
